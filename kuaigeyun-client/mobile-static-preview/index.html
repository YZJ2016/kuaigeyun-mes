<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#F8FAFC">
	<title>星制造移动端静态原型</title>
	<link rel="stylesheet" href="preview.css">
</head>
<body>
	<p class="banner">静态原型，样例数据。只改这一份预览，不请求后端，也不改移动端工程和接口。</p>
	<div class="stage">
		<div class="phone" id="phone">
			<div class="statusbar" aria-hidden="true"><span>08:52</span><span id="status-org">未登录</span></div>
			<header class="nav" id="nav">
				<button type="button" class="nav-back" id="back" hidden>
					<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
					<span>返回</span>
				</button>
				<h1 id="nav-title">登录</h1>
				<button type="button" class="nav-home" id="home" hidden>首页</button>
			</header>
			<main id="screen"></main>
			<div id="dock" hidden></div>
			<div id="dialog" hidden></div>
			<div class="home-indicator" aria-hidden="true"><span></span></div>
		</div>
	</div>
	<script src="preview.js"></script>
</body>
</html>
