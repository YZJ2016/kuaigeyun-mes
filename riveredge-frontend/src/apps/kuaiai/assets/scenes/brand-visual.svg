    <circle cx="96" cy="-34" r="6" fill="#ffd666"/>
    <circle cx="-100" cy="30" r="4" fill="#85a5ff"/>
    <path d="M0 -64 L11 -16 L60 -16 L20 12 L34 60 L0 30 L-34 60 L-20 12 L-60 -16 L-11 -16 Z" fill="url(#spark)"/>
