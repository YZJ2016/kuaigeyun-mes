  </defs>
  <rect width="280" height="420" fill="url(#bg)"/>
  <circle cx="238" cy="54" r="86" fill="#ffffff" opacity="0.05"/>
  <circle cx="32" cy="362" r="108" fill="#ffffff" opacity="0.05"/>
  <!-- 订单卡 -->
  <g transform="translate(48 104)">
    <rect x="0" y="0" width="184" height="118" rx="12" fill="#ffffff" opacity="0.1"/>
    <rect x="16" y="16" width="92" height="12" rx="6" fill="#ffd6e7" opacity="0.9"/>
    <rect x="16" y="42" width="152" height="10" rx="5" fill="url(#bar)"/>
    <rect x="16" y="62" width="118" height="10" rx="5" fill="url(#bar)" opacity="0.7"/>
    <rect x="16" y="86" width="64" height="14" rx="7" fill="#ffadd2" opacity="0.85"/>
    <!-- 状态标记 -->
    <circle cx="160" cy="24" r="10" fill="#ffd666"/>
  </g>
  <!-- 交付卡车 -->
  <g transform="translate(62 252)">
    <rect x="0" y="18" width="104" height="46" rx="6" fill="#ffadd2"/>
    <path d="M104 30 h34 l20 20 v14 h-54 z" fill="#ff85c0"/>
    <rect x="112" y="36" width="20" height="15" rx="2" fill="#9e1068" opacity="0.45"/>
    <circle cx="30" cy="68" r="12" fill="#fff" opacity="0.92"/>
    <circle cx="30" cy="68" r="6" fill="#c41d7f"/>
    <circle cx="126" cy="68" r="12" fill="#fff" opacity="0.92"/>
    <circle cx="126" cy="68" r="6" fill="#c41d7f"/>
  </g>
  <!-- 交期时钟 -->
