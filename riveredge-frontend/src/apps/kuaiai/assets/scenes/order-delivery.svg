    <circle r="18" fill="#ffffff" opacity="0.92"/>
    <circle r="18" fill="none" stroke="#9e1068" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-10" stroke="#9e1068" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7" y2="4" stroke="#9e1068" stroke-width="3" stroke-linecap="round"/>
