<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0958d9"/>
      <stop offset="1" stop-color="#003eb3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91caff"/>
      <stop offset="1" stop-color="#69b1ff"/>
    </linearGradient>
  </defs>
  <rect width="280" height="420" fill="url(#bg)"/>
  <circle cx="244" cy="54" r="90" fill="#ffffff" opacity="0.05"/>
  <circle cx="32" cy="368" r="106" fill="#ffffff" opacity="0.05"/>
  <!-- 排程时间轴 -->
  <g transform="translate(40 96)">
    <rect x="0" y="0" width="200" height="220" rx="12" fill="#ffffff" opacity="0.08"/>
    <!-- 刻度 -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.25">
      <line x1="40" y1="30" x2="40" y2="200"/>
      <line x1="100" y1="30" x2="100" y2="200"/>
      <line x1="160" y1="30" x2="160" y2="200"/>
    </g>
    <g transform="translate(0 40)">
      <rect x="20" y="0" width="80" height="18" rx="9" fill="url(#bar)"/>
      <rect x="60" y="34" width="110" height="18" rx="9" fill="url(#bar)" opacity="0.8"/>
      <rect x="30" y="68" width="70" height="18" rx="9" fill="#ff7875" opacity="0.9"/>
      <rect x="110" y="102" width="76" height="18" rx="9" fill="url(#bar)" opacity="0.6"/>
      <rect x="20" y="136" width="118" height="18" rx="9" fill="url(#bar)" opacity="0.45"/>
    </g>
    <!-- 冲突标记 -->
    <g transform="translate(64 152)">
      <circle r="11" fill="#ffd666"/>
      <path d="M-4 0 L0 5 L6 -4" stroke="#874d00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 游标 -->
    <line x1="30" y1="24" x2="30" y2="208" stroke="#ffe58f" stroke-width="2"/>
    <circle cx="30" cy="24" r="4" fill="#ffe58f"/>
  </g>
  <!-- 解释气泡 -->
  <g transform="translate(160 60)">
    <rect x="0" y="0" width="84" height="34" rx="10" fill="#e6f4ff"/>
    <path d="M16 34 l-6 12 16 -8 z" fill="#e6f4ff"/>
    <rect x="12" y="9" width="60" height="6" rx="3" fill="#0958d9" opacity="0.85"/>
    <rect x="12" y="20" width="40" height="6" rx="3" fill="#0958d9" opacity="0.45"/>
  </g>
  <g transform="translate(40 344)">
    <rect x="0" y="0" width="96" height="8" rx="4" fill="#e6f4ff" opacity="0.85"/>
    <rect x="0" y="16" width="150" height="8" rx="4" fill="#e6f4ff" opacity="0.4"/>
    <rect x="0" y="32" width="70" height="8" rx="4" fill="#69b1ff" opacity="0.7"/>
  </g>
</svg>
