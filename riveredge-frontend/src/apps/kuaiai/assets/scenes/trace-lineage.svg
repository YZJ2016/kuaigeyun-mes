<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 420" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#006d75"/>
      <stop offset="1" stop-color="#00474f"/>
    </linearGradient>
  </defs>
  <rect width="280" height="420" fill="url(#bg)"/>
  <circle cx="250" cy="50" r="90" fill="#ffffff" opacity="0.05"/>
  <circle cx="30" cy="372" r="100" fill="#ffffff" opacity="0.05"/>
  <!-- 追溯链路 -->
  <g transform="translate(140 120)">
    <!-- 连线 -->
    <g stroke="#b5f5ec" stroke-width="2.5" opacity="0.7" fill="none">
      <path d="M0 0 L-56 56"/>
      <path d="M0 0 L56 56"/>
      <path d="M-56 84 L-90 140"/>
      <path d="M-56 84 L-22 140"/>
      <path d="M56 84 L22 140"/>
      <path d="M56 84 L90 140"/>
    </g>
    <!-- 锚点节点 -->
    <circle cx="0" cy="0" r="22" fill="#b5f5ec"/>
    <rect x="-10" y="-6" width="20" height="12" rx="3" fill="#006d75"/>
    <!-- 中间层节点 -->
    <circle cx="-56" cy="70" r="16" fill="#87e8de"/>
    <circle cx="56" cy="70" r="16" fill="#87e8de" opacity="0.85"/>
    <rect x="-62" y="66" width="12" height="8" rx="2" fill="#006d75" opacity="0.8"/>
    <rect x="50" y="66" width="12" height="8" rx="2" fill="#006d75" opacity="0.8"/>
    <!-- 末端节点 -->
    <circle cx="-90" cy="148" r="11" fill="#ffffff" opacity="0.6"/>
    <circle cx="-22" cy="148" r="11" fill="#ffffff" opacity="0.5"/>
    <circle cx="22" cy="148" r="11" fill="#ffffff" opacity="0.5"/>
    <circle cx="90" cy="148" r="11" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- 方向箭头 -->
  <g transform="translate(140 300)" fill="none" stroke="#b5f5ec" stroke-width="2.5" opacity="0.8">
    <path d="M-46 0 h24 m-8 -6 l8 6 -8 6"/>
    <path d="M46 0 h-24 m8 -6 l-8 6 8 6"/>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#b5f5ec" stroke="none"/>
  </g>
  <!-- 批次标签 -->
  <g transform="translate(90 330)">
    <rect x="0" y="0" width="100" height="24" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="12" y="8" width="56" height="8" rx="4" fill="#b5f5ec" opacity="0.85"/>
  </g>
</svg>
